<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pregunta 5</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #F5F7FA; }</style>
</head>
<body>

<div style="width: 1280px; height: 860px; box-sizing: border-box; background: #F5F7FA; display: flex; flex-direction: column;">

  <div style="box-sizing: border-box; padding: 26px 34px; display: flex; align-items: center; gap: 12px;">
    <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: linear-gradient(135deg, #2B9BF4, #1554D8); border-radius: 10px; color: #FFFFFF; font-size: 18px; font-weight: 800; line-height: 1;">R</span>
    <span style="font-size: 17px; font-weight: 700; color: #0F172A; letter-spacing: -0.01em;">Retorika Builder</span>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 0 60px 24px 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;">

    <div style="width: 900px; box-sizing: border-box; padding: 34px 52px 28px 52px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 3px rgba(15,23,42,0.06); display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; justify-content: center; gap: 7px;">
        <span style="width: 22px; height: 5px; border-radius: 3px; background: #156FE7;"></span>
        <span style="width: 22px; height: 5px; border-radius: 3px; background: #156FE7;"></span>
        <span style="width: 22px; height: 5px; border-radius: 3px; background: #156FE7;"></span>
        <span style="width: 22px; height: 5px; border-radius: 3px; background: #156FE7;"></span>
        <span style="width: 30px; height: 5px; border-radius: 3px; background: #156FE7;"></span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="font-size: 14px; font-weight: 500; color: #94A3B8;">Paso 5 de 5</span>
        <h1 style="margin: 0; font-size: 36px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; color: #0F172A; text-align: center;">¿Qué quieres que haga quien entre?</h1>
        <p style="margin: 0; font-size: 16px; color: #64748B; text-align: center;">Será el botón principal de tu web, el más visible de todos.</p>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px;">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Acción principal</legend>

        <label style="display: flex; align-items: center; height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 11px; cursor: pointer;">
          <input type="radio" name="accion" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
          <span style="font-size: 15px; font-weight: 500; color: #334155;">Que me llamen</span>
        </label>

        <label style="display: flex; align-items: center; gap: 10px; height: 56px; box-sizing: border-box; padding: 0 16px; background: #F1F7FE; border: 2px solid #156FE7; border-radius: 11px; cursor: pointer;">
          <input type="radio" name="accion" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">
          <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #156FE7;">Que reserven</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#156FE7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
        </label>

        <label style="display: flex; align-items: center; height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 11px; cursor: pointer;">
          <input type="radio" name="accion" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
          <span style="font-size: 15px; font-weight: 500; color: #334155;">Que me escriban</span>
        </label>

        <label style="display: flex; align-items: center; height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 11px; cursor: pointer;">
          <input type="radio" name="accion" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
          <span style="font-size: 15px; font-weight: 500; color: #334155;">Que me manden un correo</span>
        </label>

        <label style="display: flex; align-items: center; height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 11px; cursor: pointer;">
          <input type="radio" name="accion" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
          <span style="font-size: 15px; font-weight: 500; color: #334155;">Que vengan al local</span>
        </label>

      </fieldset>

      <div style="padding: 20px; background: #F8FAFC; border: 1px solid #E3E8F0; border-radius: 12px; display: flex; flex-direction: column; gap: 13px;">
        <span style="font-size: 15px; font-weight: 600; color: #0F172A;">¿Dónde reservan?</span>
        <input id="enlace" type="text" placeholder="Pega el enlace de tu sistema de reservas" style="height: 52px; box-sizing: border-box; padding: 0 18px; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #0F172A; background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 10px; outline: none;">
        <label for="enlace" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Enlace de reservas</label>
        <label style="display: flex; align-items: center; gap: 11px; cursor: pointer;">
          <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #156FE7;">
          <span style="font-size: 14px; color: #475569;">Añadir también mi teléfono</span>
        </label>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 6px;">
        <a href="04-question-4-location.html" style="font-size: 15px; font-weight: 500; color: #94A3B8; text-decoration: none;">Atrás</a>
        <a href="06-generating.html" style="display: inline-flex; align-items: center; justify-content: center; height: 50px; padding: 0 34px; background: #156FE7; color: #FFFFFF; font-size: 15px; font-weight: 600; border-radius: 11px; text-decoration: none;">Crear mi web</a>
      </div>

    </div>

    <span style="font-size: 15px; color: #A3AEC0;">Es la última. En unos segundos tendrás tu web delante.</span>

  </div>

</div>

</body>
</html>
