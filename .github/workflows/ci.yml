name: CI

# Protocol Part 9.2. The jobs are separate so a failure says at a glance what broke, and
# every job runs a named repository script — never a command written only here. A command
# that exists only in this file is one the laptop cannot run, and then CI and local
# development are two things maintained separately.

on:
  # pull_request already covers every push to a branch that has one open, so a push
  # trigger on branches would only double the bill. Until a PR exists, a push to a branch
  # deliberately runs nothing.
  pull_request:
    branches: [main]
  push:
    branches: [main]

# None of these jobs writes anything. The default token grants more than any of them needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled on branches. On main they are left to finish, because
  # main's history is what rollbacks and release notes get read from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  editor-build:
    name: editor-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # apps/editor cannot join tsc --build's project references (its tsconfig sets
      # noEmit: true so Next.js does its own type-checking during the build), so `pnpm
      # typecheck` never touches it. This is the same command render.yaml's buildCommand
      # runs, so a broken deploy fails here first, not on Render.
      # Built and started **with a DSN in the environment, like production and unlike every
      # other gate.** Since 13 October 2026 Render carries `NEXT_PUBLIC_SENTRY_DSN`, so
      # `instrumentation.ts`'s `register()` really initialises the SDK at startup there — and
      # Next's own guide says `register` «must complete before the server is ready to handle
      # requests», which is exactly where a port would fail to open. The `e2e` job runs with no
      # DSN on purpose (its walk proves the inert state), so this job is the one that starts the
      # server the way production does. The host is `.invalid`, which never resolves, so nothing
      # can leave the runner even if something throws; the key is sixteen zeroes and is nobody's.
      - run: pnpm build:editor
        env:
          NEXT_PUBLIC_SENTRY_DSN: https://00000000000000000000000000000000@o0.ingest.invalid/1
      # And the same command render.yaml's startCommand runs, for the same reason — with one
      # outage behind it. On 12 October 2026 `next build` passed everywhere and `next start`
      # failed on Render: it requires the compiled next.config with plain Node, which could not
      # load a project `.ts` import, so the server bound no port and retried into the same wall.
      # A build that passes and a server that starts are two different facts; this checks the
      # second. `/` is prerendered, so a 200 here needs no database and no key.
      - name: Start the built server, with a DSN set, and ask it for the landing
        env:
          NEXT_PUBLIC_SENTRY_DSN: https://00000000000000000000000000000000@o0.ingest.invalid/1
        run: |
          ./apps/editor/node_modules/.bin/next start apps/editor -p 4199 > start.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4199/; then echo "landing answered"; exit 0; fi
            sleep 1
          done
          echo "the built server never answered /; its log:"; cat start.log; exit 1

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A floor against regressions, not a target: the quality guarantee of this project
      # is the invariants. See docs/decisions/0006-coverage-is-a-ratcheted-floor.md.
      - run: pnpm test:coverage

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The five of Part 8.2. INV_4 is provisional in phase 0 and says so in its own name
      # and in docs/document-rules.md.
      - run: pnpm test:invariants

  golden:
    name: golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Never with UPDATE_GOLDEN=1 here. Regenerating in CI would mean the build approving its own
      # output, which is the one thing the golden corpus exists to prevent.
      - run: pnpm test:golden

  a11y-size:
    name: a11y-size
    runs-on: ubuntu-latest
    # A Chromium download on a cold cache plus the combination matrix, not a ten-minute job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Protocol Part 8.5: under 60 KB gzipped, zero JavaScript.
      - run: pnpm size

      # The browser binary is cached on the exact Playwright version, which is what decides
      # which Chromium build it expects. Chromium only: it is an implementation detail of two
      # assertions, not a compatibility matrix.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # On a cache hit the browser is there but the system libraries it links against are
      # not, because the runner is new every time.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # axe (serious/critical, and every contrast finding, measured or not) and horizontal
      # overflow at 320/768/1280, over the three sets issue #25 split this into: geometry,
      # contrast/fonts, and long text.
      - run: pnpm test:a11y

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The same cache block as a11y-size, verbatim: Lighthouse drives the Chromium Playwright
      # installed, so one browser serves both jobs and the key is the same.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Protocol Part 8.5: performance and accessibility at 95 or more over a sample site, the
      # three compositions, mobile preset. The four scores per composition are in the log.
      - run: pnpm lighthouse

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # 20 since 16 October 2026, and the number is a measurement rather than a round-up. Sprint 22
    # added sixteen walks to `critical-flows.e2e.test.ts` and this job was **cancelled at 15m05s
    # on its own limit with all 186 tests already green** — the summary printed, the step killed
    # during cleanup, and `gh pr checks` reporting it as a failure. Nothing was wrong with the
    # suite; it had simply outgrown its budget. The cheap half was fixed first, by giving the
    # sprint's proposals walks one shared journey instead of four, so this is slack and not a
    # ceiling raised to cover waste: the run that overran measured 866s of tests, and the local
    # full suite went 471s → 778s across the sprint.
    timeout-minutes: 20
    # Protocol Part 9.2: "El job `e2e` se limita a los pull request porque los minutos de
    # Actions son finitos y Playwright es lo más lento de todo." A push straight to main skips
    # it — every push that matters had a pull request first, which already ran this.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The same cache block as a11y-size, verbatim: same browser, same version, same reason
      # to keep it — a Chromium download on every run would make this the slowest job here by
      # a wide margin instead of a comparable one.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Three of the five critical flows the protocol names — see the doc comment at the top
      # of apps/editor/e2e/critical-flows.e2e.test.ts for which two are missing and why.
      - run: pnpm e2e

  # **The same walks, with the canvas on its other route** (ADR 0051 §6, sprint 26 día 3). The
  # editor keeps two canvases until sprint 27 closes: `swap`, the default the job above runs, and
  # `patch`, chosen per browser by `localStorage["rb.canvas"]`. `RETORIKA_CANVAS=patch` makes the
  # e2e harness set that key in every context it opens, so one suite serves both and no walk has
  # two versions. **Non-blocking until día 5**: the walks were written against a canvas that
  # replaces its document on every edit (`replacingTheDocument` waits for a *new* document), and
  # día 5 rewrites that contract (`afterTheEdit`) and turns the default; until then this job's red
  # is information, not a gate, and `continue-on-error` says so in the one place CI reads. Day 5
  # removes the line, and from then until the 27 closes both jobs block.
  e2e-patch:
    name: e2e (patch)
    runs-on: ubuntu-latest
    # 30 and not the blocking job's 20 (día 4): under `patch` the walks that wait for a new document
    # each wait their own timeout before failing, and as the route fixes more of them the run gets
    # *longer*, not shorter — día 4's run was cancelled at 20 with 178 green, 17 red and the device
    # walks still to go. A non-blocking job that is killed before its summary informs nobody; ten
    # minutes of slack is what it costs to read the whole picture until día 5 turns the contract.
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Verbose, because this job's output is the whole of its value today: the first run printed
      # nothing before the 20-minute kill — vitest's default reporter speaks only at the end, and
      # under `patch` the walks that wait for a new document each wait their own timeout — so a
      # cancelled job said which route it ran and not one word about which walks it had passed.
      # With one line per walk as it lands, the kill still leaves the picture día 5 needs.
      - run: pnpm e2e --reporter=verbose
        env:
          RETORIKA_CANVAS: patch

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Before the audit, so that an exception cannot be added without its date and
      # reason. An undocumented ignore is how a blocking audit stops blocking.
      - run: pnpm audit:exceptions

      - run: pnpm security:audit

      # gitleaks runs through pre-commit so the pinned rev in .pre-commit-config.yaml
      # stays the only place that version is written — the same rule as Node and pnpm.
      # It also avoids gitleaks-action, which wants a licence key for org-owned repos.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Deliberately no `cache: pip`. It insists on hashing a requirements.txt or a
          # pyproject.toml for its key, and this project has neither — pre-commit is
          # installed directly. It failed the first run for exactly that reason.

      # The cache worth having, keyed on a file that actually exists: pre-commit builds
      # gitleaks' Go environment from scratch otherwise, on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit
      - run: pnpm security:secrets

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The guards compare against a base commit, and a shallow clone has no merge
          # base to resolve. Full history while the repository is young; narrow this to
          # the base branch if it ever gets heavy.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The range is explicit in both directions and never inferred. If it cannot be
      # computed, this step FAILS — a guard that does not know what to compare and answers
      # "all fine" is worse than no guard, because it turns an unknown into a green tick.
      - name: Resolve the diff range
        id: range
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          created="${{ github.event.created }}"

          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          fail() { echo "guards: cannot determine what to compare — $1" >&2; exit 1; }

          [ -n "$head" ] || fail "no head commit"
          git cat-file -e "${head}^{commit}" 2>/dev/null || fail "head ${head} is not in this clone"

          # An all-zero "before" means one of two very different things, and telling them
          # apart is the whole point of this block.
          #
          #  * The push that CREATED the ref. For this repository's very first push to
          #    main there is genuinely no earlier commit, so the base becomes the empty
          #    tree and the guards run over EVERY file. Bootstrap is checked, not skipped.
          #    github.event.created is true exactly in that case.
          #
          #  * Anything else. Then it is an unknown, not an empty diff, and it still
          #    fails closed — a guard that does not know what to compare and answers
          #    "all fine" turns an unknown into a green tick.
          #
          # This is the case that gets forgotten, which is why it is spelled out. It cost
          # the first CI run; see "What the first run taught" in docs/tasks/ci.md.
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              if [ "$event" = "push" ] && [ "$created" = "true" ]; then
                # Two dots, not three: the empty tree shares no merge base with anything,
                # so "..." is invalid against it.
                empty="$(git hash-object -t tree /dev/null)"
                echo "range=${empty}..${head}" >> "$GITHUB_OUTPUT"
                echo "Repository bootstrap: comparing the whole tree against ${head}"
                exit 0
              fi
              fail "no usable base commit (got '${base}')"
              ;;
          esac

          git cat-file -e "${base}^{commit}" 2>/dev/null || fail "base ${base} is not in this clone (shallow checkout?)"
          git merge-base "$base" "$head" >/dev/null 2>&1 || fail "no merge base between ${base} and ${head}"

          echo "range=${base}...${head}" >> "$GITHUB_OUTPUT"
          echo "Comparing ${base}...${head}"

      # A schema change without its migration (Part 8.4).
      - run: pnpm schema:guard "${{ steps.range.outputs.range }}"

      # A runtime dependency that would travel to the client's published site (ADR 0001).
      - run: pnpm renderer:deps

      # The database service key reachable from a browser bundle (protocol Part 15).
      - run: pnpm secrets:scope

      # A coverage floor that went down (ADR 0006).
      - run: pnpm coverage:ratchet "${{ steps.range.outputs.range }}"
