<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XSS &lt;script&gt;alert(&#39;site&#39;)&lt;/script&gt;</title>
<style>
:root {
  --color-accent: #FF3A72;
  --color-ink: #0F172A;
  --color-muted: #475569;
  --color-primary: #156FE7;
  --color-secondary: #105CB1;
  --color-surface: #FFFFFF;
  --font-body: system-ui, sans-serif;
  --font-heading: Georgia, serif;
  --radius-lg: 16px;
  --radius-md: 8px;
  --radius-sm: 4px;
  --size-body: 1rem;
  --size-heading: 2.5rem;
  --size-subheading: 1.5rem;
  --space-lg: 24px;
  --space-md: 16px;
  --space-sm: 8px;
  --space-xl: 48px;
  --space-xs: 4px;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); color: var(--color-ink);
  background: var(--color-surface); }
.rb-section { display: grid; grid-template-columns: repeat(12, 1fr);
  gap: var(--space-md); padding: var(--space-xl); align-items: center; }
.rb-section img { width: 100%; height: auto; border-radius: var(--radius-md); }
.rb-section h1 { font-family: var(--font-heading); font-size: var(--size-heading);
  color: var(--color-primary); margin: 0; }
.rb-section h2 { font-family: var(--font-heading); font-size: var(--size-subheading);
  color: var(--color-secondary); margin: 0; }
.rb-section p { font-size: var(--size-body); color: var(--color-muted); margin: 0; }
.rb-section [role=button] { display: inline-block; padding: var(--space-sm) var(--space-md);
  background: var(--color-primary); color: var(--color-surface);
  border-radius: var(--radius-sm); text-decoration: none; }

@media (max-width: 720px) {
  .rb-section { grid-template-columns: 1fr; padding: var(--space-lg); }
  .rb-section > * { grid-column: 1 / -1 !important; }
}
</style>
</head>
<body>
<main class="rb-page" data-page="home">
  <section class="rb-section rb-cover rb-image-right" data-preset="cover" data-section="sec-cover" data-variant="image-right">
    <h1 data-role="heading" data-slot="headline" style="grid-column:1/span 6;grid-row:1/span 1">
      &quot;&gt;&lt;script&gt;alert(1)&lt;/script&gt;
    </h1>
    <h2 data-role="subheading" data-slot="subheadline" style="grid-column:1/span 6;grid-row:2/span 1">
      &quot; onerror=alert(2) x=&quot;
    </h2>
    <p data-role="body" data-slot="body" style="grid-column:1/span 6;grid-row:3/span 1">
      a &quot;double quote&quot; that ends up in an attribute
    </p>
    <img alt="&quot; onerror=alert(3) &quot;" data-role="image" data-slot="image" src="assets/xss.svg" style="grid-column:7/span 6;grid-row:1/span 4">
    <a data-role="button" data-slot="primaryAction" href="#" role="button" style="grid-column:1/span 3;grid-row:4/span 1">
      Click me
    </a>
    <a data-role="link" data-slot="secondaryAction" href="#" style="grid-column:4/span 3;grid-row:4/span 1">
      Other
    </a>
  </section>
</main>
</body>
</html>
