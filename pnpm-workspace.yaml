packages:
  - "packages/*"
  - "apps/*"
auditConfig:
  ignoreGhsas:
    - GHSA-68fv-2mgg-jv7q
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.14'
  - '@biomejs/cli-darwin-arm64@2.5.14'
  - '@biomejs/cli-darwin-x64@2.5.14'
  - '@biomejs/cli-linux-arm64-musl@2.5.14'
  - '@biomejs/cli-linux-arm64@2.5.14'
  - '@biomejs/cli-linux-x64-musl@2.5.14'
  - '@biomejs/cli-linux-x64@2.5.14'
  - '@biomejs/cli-win32-arm64@2.5.14'
  - '@biomejs/cli-win32-x64@2.5.14'
  - '@types/node@24.13.5'
  - fast-check@4.10.1

# **Settings pnpm reads, which stopped being `package.json`'s `pnpm` field in pnpm 10.**
# Found on 6 October 2026: `pnpm install` warns «The "pnpm" field in package.json is no longer read
# by pnpm», and it had been carrying `auditConfig` — so the audit-exception mechanism had quietly
# stopped being wired to anything. `scripts/audit-exceptions.ts` reads this file now.

# `source-map-js` below 1.2.2 is GHSA-68fv-2mgg-jv7q, a high-severity event-loop denial of service
# through indexed source-map section offsets. It arrives nine ways under `next`, `@tailwindcss/
# postcss` and `vite`, none of which ship at runtime — PostCSS and the bundler are build tools, and
# ADR 0001 keeps every one of them out of what a client downloads. It is pinned rather than
# excepted because **a patch exists**: the exception hatch in `audit-exceptions.ts` is for «a
# transitive dependency with no patch available», and using it here would be using it to avoid a
# one-line upgrade. The range is targeted, so only the vulnerable versions are rewritten and a
# consumer that already asks for a newer one is untouched.
# `sharp` below 0.35.5 is GHSA-wq5f-xc86-pv6w, a high-severity flaw reached through its bundled
# `librsvg` (CVE-2026-96889). It arrives once, as `next`'s optional dependency for image
# optimisation, which is build-time only here and never reaches a client's site — ADR 0001 again.
# Pinned rather than excepted for the same reason as the line above: 0.35.5 is published, so the
# exception hatch would be standing in for a one-line upgrade. The patch is a minor bump within the
# same line, and the prebuilt `@img/sharp-*` binaries follow it.
# `vite` below 8.3.3 carries three advisories against its bundled `launch-editor`, all of them in
# the dev server's «open in editor» path and all Windows-only: GHSA-587h-7wmj-h5pm (high — an
# `fs.existsSync()` check that can be bypassed), GHSA-698v-4r3x-3vcv and GHSA-r825-w8mm-5pxw (both
# moderate — `%` left out of command escaping, and editor CLI flags misread into arbitrary command
# execution). It arrives four ways, every one of them under `vitest`: the test runner's own bundler,
# which is a development dependency and reaches no client's site — ADR 0001 again — and this
# repository does not run a Vite dev server at all. Pinned rather than excepted for the same reason
# as the two lines above: 8.3.3 is published, so the hatch would be standing in for a one-line
# upgrade. `vitest` 5.0.1 asks for `^6.4.0 || ^7.0.0 || ^8.0.0`, so the range resolves inside what it
# already accepts.
overrides:
  "source-map-js@<1.2.2": ">=1.2.2"
  "sharp@<0.35.5": ">=0.35.5"
  "vite@<8.3.3": ">=8.3.3"
  "fast-uri@<3.1.9": ">=3.1.9"
  "zod@<4.6.6": "^4.6.6"
  "glob@>=9.0.0 <14.0.2": "^14.0.2"
# `fast-uri` below 3.1.9 is GHSA-w74x-v6f9-j3xg and GHSA-wjr9-j795-jxcr, both moderate: a scheme
# spoofed through percent-encoding, and a host confused by unchecked WHATWG canonicalization. It
# arrives twice, under `lighthouse` (`ajv`, and `ajv-formats`'s own `ajv`) — the protocol's Part 8.5
# measuring tool, a development dependency that reaches no client's site, ADR 0001 again. Pinned
# rather than excepted for the same reason as the three lines above: 3.1.9 is published.
# `zod` below 4.6.6 is a high-severity advisory: validating an oversized constrained collection can
# exhaust memory. Two different reaches, and the one that matters is not this line's. `zod` is a
# runtime dependency of `packages/schema`, `packages/copybank` and `packages/photobank` — the schema
# parses every document the editor loads — and those three pins moved to 4.6.6 in their own
# `package.json`, exactly as they were pinned before. **This line is for the fourth copy**, under
# `lighthouse`'s `puppeteer-core` → `chromium-bidi`, which asks for `^4.6.5` and was left on 4.6.5 by
# the install; a development tool that reaches no client's site. `^4.6.6` rather than `>=` because
# that dependency's own range stops at the major, and an override must not take it past what it
# accepts.
# `glob` from 9.0.0 to 14.0.1 is GHSA-3g3m-2fjr-6pw4 (moderate: an `AbortSignal` cancellation can be
# bypassed and the walk goes on after its timeout), and the `minimatch` it brings, below 11.0.1, is
# GHSA-g3hv-75wg-m249 (moderate: a denial of service by amplifying glob parts). Both arrive one way,
# `@sentry/nextjs` → `@sentry/bundler-plugins` → `glob` 13.0.6 → `minimatch` 10.2.6, and neither is
# ever run here: the bundler plugin is Sentry's build-time source-map uploader, and
# `apps/editor/next.config.ts` does not call `withSentryConfig` — so it reaches no client's site and
# not even our build, ADR 0001 again. Pinned rather than excepted because 14.0.2 is published, and
# **this is the one line here that takes a dependency past the range it asks for**: the bundler
# plugin wants `^13.0.6`, in its latest release (11.10.0) as in ours, so no upgrade of Sentry closes
# it. What it uses is `import { glob } from "glob"` — the named async walk, the same from 9 to 14 —
# and `glob` 14 asks for `minimatch ^11.0.0`, which retires the second advisory with no line of its
# own. Checked on 31 October 2026 with the editor's production build and the observability tests,
# which load `@sentry/nextjs`.
