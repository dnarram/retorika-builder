# Render Blueprint — the Retorika Builder application.
#
# The application, not the client sites: a published site is static files that live on the
# client's own hosting and depend on no service of ours (ADR 0001, ADR 0008).
#
# ADR 0012 approved Render and said "Docker". The native Node runtime is used instead, because
# Render's Node services now default to Node 24 and the Dockerfile bought nothing but a build
# step to maintain. See the note in that ADR.
#
# The free plan sleeps after ~15 minutes without traffic and takes about a minute to wake, so
# the URL is opened a minute before it is shown to anyone. Moving off the free plan is changing
# `plan:` on this same service — no migration.
#
# No `corepack enable`, and none of pnpm/action-setup's approach either: Render's Node image
# ships its own `pnpm` at /usr/bin/pnpm on a filesystem corepack cannot write to, so `corepack
# enable` fails outright (`EROFS: read-only file system, unlink '/usr/bin/pnpm'`), and that
# pre-installed pnpm's version is undocumented and not the 12.4.2 this repo is pinned to. `npx
# pnpm@12.4.2` sidesteps both: it fetches the exact pinned release into npm's own cache rather
# than touching /usr/bin, the same guarantee CI gets from reading `packageManager`.
services:
  - type: web
    name: retorika-builder
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npx --yes pnpm@12.4.2 install --frozen-lockfile && npx --yes pnpm@12.4.2 --filter @retorika/editor build
    # `next start` binds to port 3000 unless told otherwise — it does not read $PORT itself
    # (checked in next/dist/server/lib/start-server.js: the port is whatever -p/--port
    # resolved to, default 3000, full stop). Render assigns its own $PORT and times out the
    # deploy scanning for it, so it has to be passed through explicitly.
    #
    # **Started straight from the local binary, with no npx and no pnpm.** It used to be
    # `npx --yes pnpm@12.4.2 --filter @retorika/editor start -p $PORT`, and on 29 September 2026 a
    # deploy built successfully and then timed out with no open port and — the part worth writing
    # down — **no output at all** between "Running" and the timeout.
    #
    # What that incident ruled out, so nobody re-derives it: the same command binds the right port
    # locally and pnpm does forward `-p` (it is pnpm's own shorthand for `--parallel`, so that was
    # the first suspicion and it was wrong); and an empty `$PORT` fails loudly with
    # "option '-p, --port <port>' argument missing", so silence is not that either. The cause was
    # not identified from the log.
    #
    # What is certain is that the old command did three things before the server could boot —
    # fetch a package manager over the network, resolve a workspace filter, and forward a flag
    # through it — and a start path that needs the network is fragile by construction whether or
    # not it caused this. `next` is a production dependency of `apps/editor`, so pnpm writes this
    # binary during the build install and it survives `NODE_ENV=production`.
    #
    # **It happened again on 13 October 2026, on the first deploy after #229 — the same silence,
    # fifteen minutes, no port.** It was also the first deploy with `NEXT_PUBLIC_SENTRY_DSN` set,
    # and `instrumentation.ts`'s `register()` is the one thing that runs before the port opens
    # and reads it. Reproduced before touching anything: `main` built locally and started with
    # this exact command and a DSN in the environment answers `/` in two seconds and prints its
    # banner, on the same Node 24.21.0. So no mechanism is claimed; what changed is that CI's
    # editor-build job now builds and starts with a DSN, like production, so the one variable
    # that separated production from every gate separates them no longer. If a redeploy of the
    # same commit binds, it was the instance; if it does not and a deploy without the DSN does,
    # it is the SDK at startup on Render's instance and the next step is the SDK's debug output.
    # **A redeploy of the same commit bound its port** (David, 13 October 2026): the instance,
    # twice out of two, and the DSN is cleared of this one.
    startCommand: ./apps/editor/node_modules/.bin/next start apps/editor -p $PORT
    envVars:
      # engine-strict is on and the root package.json asks for ^24.21.0. Render's own default is
      # 24.14.1, which does not satisfy it, so the install would fail without this line.
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      # Error reporting (protocol Part 17), ON since 13 October 2026: David accepted Sentry as a
      # third processor of personal data — DPA accepted, EU data residency — and the privacy
      # notice (`account.save.privacy`) carries its sentence (ADR 0034 §14, amended). The value
      # is set in Render's dashboard, never here: the DSN is public by design, and `sync: false`
      # keeps it out of this file all the same, like every other value set by hand. Without the
      # variable the editor sends nothing anywhere, which is CI's state and the `e2e` asserts it.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
